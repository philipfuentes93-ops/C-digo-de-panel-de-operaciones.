  [data-theme="noche"] .add-row input:focus,[data-theme="noche"] .cell-edit:focus,[data-theme="noche"] .task-name [contenteditable]:focus{background:var(--hover)}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;font-size:14px;display:flex;min-height:100vh;transition:background .3s,color .3s}
  .themes{display:flex;gap:8px;flex-wrap:wrap;padding:6px 10px}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;transition:transform .15s,border-color .15s}
  .swatch:hover{transform:scale(1.15)}
  .swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--white) inset}
  h1{background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 small{-webkit-text-fill-color:var(--ink-2)}
  .btn.primary{background:linear-gradient(120deg,var(--brand),var(--brand2));border:none;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
  .btn{transition:transform .15s,box-shadow .15s}
  .row td{animation:rowIn .25s ease-out both}
  @keyframes rowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .status,.prio{transition:transform .15s,filter .15s}
  .status:hover,.prio:hover{transform:scale(1.03);filter:brightness(1.08)}
  .status.pulse{animation:pulse .5s ease}
  @keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(255,255,255,.35) inset}100%{transform:scale(1)}}
  .chip{transition:transform .15s}
  .chip:hover{transform:translateY(-1px)}
  .sum-bar span{transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .avatar{background:linear-gradient(135deg,var(--brand),var(--brand2))}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--brand);outline-offset:1px}

  aside{width:230px;background:var(--side);padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
  aside .brand{font-weight:800;font-size:18px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
  aside .item{padding:8px 10px;border-radius:6px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
  aside .item.active{background:#DCDFEC;color:var(--ink)}
  aside .item:hover{background:#E4E7F2}
  aside .item .badge{background:var(--s-detenido);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
  aside .item .badge.warn{background:var(--s-trabajando)}
  aside .item .badge.zero{display:none}
  aside .sep{border-top:1px solid var(--line);margin:8px 0}
  aside .small{font-size:12px;color:var(--ink-2);padding:0 10px}

  main{flex:1;min-width:0;padding:22px 28px 60px;background:var(--white);margin:12px 12px 12px 0;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:24px;font-weight:700;margin:0}
  h1 small{display:block;font-size:13px;font-weight:500;color:var(--ink-2);text-transform:capitalize;margin-top:2px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:7px 14px;border-radius:6px;font-weight:600;border:1px solid var(--line);background:#fff}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn:hover{filter:brightness(.97)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0 12px;margin-bottom:18px}
  .toolbar input,.toolbar select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff}
  .toolbar input{min-width:220px}
  .chip{padding:5px 10px;border-radius:6px;font-weight:600;font-size:13px;border:1px solid transparent;display:flex;gap:6px;align-items:center}
  .chip.on{border-color:var(--ink)}
  .chip.overdue{background:#FBE6E9;color:#B7233C}
  .chip.today{background:#FFF1DC;color:#B26A00}
  .chip.soon{background:#E4EFFF;color:#2A63B5}
  .chip b{font-size:14px}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:4px 0 16px;box-shadow:0 8px 24px rgba(0,0,0,.08);animation:panelIn .2s ease-out;border-top:4px solid var(--brand)}
  .panel[hidden]{display:none}
  @keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .panel h2{margin:0 0 12px;font-size:16px;font-weight:700}
  .fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600}
  .fgrid .full{grid-column:1/-1} .fgrid .half{grid-column:span 3} .fgrid .third{grid-column:span 2}
  .fgrid input,.fgrid select,.fgrid textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--hover);width:100%}
  .fgrid textarea{resize:vertical;min-height:60px}
  .fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{border-color:var(--brand);background:var(--white);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .edit{color:var(--ink-2);font-size:13px;opacity:0;padding:2px 6px;border-radius:4px}
  .row:hover .edit{opacity:1}
  .edit:hover{background:var(--hover);color:var(--brand)}
  @media (max-width:900px){.fgrid{grid-template-columns:repeat(2,1fr)} .fgrid .half,.fgrid .third{grid-column:span 2}}

  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .login[hidden]{display:none}
  .login .box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:32px;max-width:400px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.12);border-top:5px solid var(--brand)}
  .login h2{margin:0 0 6px;font-size:22px}
  .login p{color:var(--ink-2);margin:0 0 20px}
  .login .err{color:#B7233C;font-weight:600;margin-top:12px}
  .sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:6px 10px}
  .sync i{width:8px;height:8px;border-radius:50%;background:var(--s-nuevo)}
  .sync.ok i{background:var(--s-listo)} .sync.saving i{background:var(--s-trabajando)} .sync.err i{background:var(--s-detenido)}
  .me{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px}
  .me button{color:var(--ink-2);font-size:12px;text-decoration:underline}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
  .tab{border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:8px;padding:7px 14px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink-2);transition:transform .15s}
  .tab:hover{transform:translateY(-1px)}
  .tab i{width:10px;height:10px;border-radius:50%;background:var(--ac,var(--ink-2));display:inline-block}
  .tab small{font-weight:500;font-size:11.5px;opacity:.8}
  .tab .n{background:var(--line);border-radius:999px;padding:0 7px;font-size:11.5px}
  .tab.on{background:#fff;color:var(--ink);border-color:var(--ac,var(--ink));box-shadow:0 2px 8px rgba(0,0,0,.08)}
  [data-theme="noche"] .tab{background:rgba(255,255,255,.06)} [data-theme="noche"] .tab.on{background:#2B3050}
  .area-head{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ac)}
  .area-head h2{margin:0;font-size:18px;font-weight:800;color:var(--ac)}
  .area-head span{color:var(--ink-2);font-size:13px}
  .area-head .area-add{margin-left:auto;color:var(--ink-2);font-weight:600;font-size:13px}
  .area-head .area-add:hover{color:var(--ink)}
  .area-empty{color:var(--ink-2);padding:10px 4px 20px;font-size:13px}
  aside .item i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
  aside .item .badge.soft{background:var(--line);color:var(--ink-2)}

  .avatar{position:relative;overflow:hidden;background:var(--pc,var(--brand))}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .avatar.lg{width:34px;height:34px;font-size:13px}
  .tab .avatar{width:22px;height:22px;font-size:9px;margin-left:-2px}
  .area-head .avatar{width:30px;height:30px;font-size:11px}
  .person{justify-content:flex-start;padding-left:8px}

  .toolbar select.active,.toolbar input.active{border-color:var(--brand)!important;background:#EEF0FF!important;color:var(--brand);font-weight:600}
  #btnClear{color:var(--brand);font-weight:700;padding:6px 10px;border-radius:6px;border:1px dashed var(--brand);background:rgba(255,255,255,.7)}
  #btnClear[hidden]{display:none}
  .area-tag{font-size:10.5px;font-weight:700;color:#fff;background:var(--ac);border-radius:4px;padding:2px 6px;white-space:nowrap}

  .group{margin-bottom:26px}
  .g-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700;font-size:16px}
  .g-head .caret{font-size:12px;width:18px;color:inherit;transition:transform .15s}
  .group.collapsed .caret{transform:rotate(-90deg)}
  .group.collapsed .tbl-wrap,.group.collapsed .g-sum{display:none}
  .g-head .name{outline:none;border-radius:4px;padding:1px 4px}
  .g-head .name:focus{background:var(--hover)}
  .g-head .count{color:var(--ink-2);font-weight:500;font-size:13px}
  .g-head .gmenu{margin-left:auto;color:var(--ink-2);font-size:18px;opacity:0}
  .group:hover .gmenu{opacity:1}

  .tbl-wrap{overflow-x:auto}
  .tbl{width:100%;min-width:1180px;border-collapse:separate;border-spacing:0;font-size:13.5px}
  .tbl th{font-weight:500;color:var(--ink-2);text-align:center;padding:6px 8px;border:1px solid var(--line);border-left:none;border-bottom:none;background:#fff;white-space:nowrap}
  .tbl th:first-child{text-align:left;border-left:6px solid var(--gc)}
  .tbl td{border:1px solid var(--line);border-left:none;border-bottom:none;padding:0;height:36px;background:#fff;text-align:center;vertical-align:middle}
  .tbl td:first-child{border-left:6px solid var(--gc);text-align:left}
  .tbl tr.row:hover td{background:var(--hover)}
  .tbl tr.row.dragging td{opacity:.5}
  .tbl tr.done .task-name{color:var(--ink-2)}
  .col-name{width:22%} .col-client{width:11%} .col-person{width:11%} .col-status{width:10%} .col-prio{width:7%} .col-date{width:8%} .col-days{width:5%} .col-dept{width:8%} .col-log{width:9%} .col-x{width:36px}

  .task-name{padding:0 8px;display:flex;align-items:center;gap:8px;min-height:36px}
  .task-name .grip{color:var(--line);cursor:grab;font-size:14px}
  .task-name [contenteditable]{flex:1;outline:none;padding:4px 4px;border-radius:4px;border:1px solid transparent}
  .task-name [contenteditable]:focus{border-color:var(--brand);background:#fff}
  .cell-edit{width:100%;height:36px;border:none;background:transparent;text-align:center;padding:0 6px;outline:none}
  .cell-edit:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--brand)}
  .cell-edit.date{font-size:12.5px;color:var(--ink-2)}
  .cell-edit.date::-webkit-calendar-picker-indicator{opacity:.5}
  .person{display:flex;align-items:center;justify-content:center;gap:6px}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .person input{width:auto;min-width:0;flex:1;text-align:left}

  .status,.prio{height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;cursor:pointer;position:relative;user-select:none;font-size:13px}
  .pop{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);display:grid;gap:6px;min-width:150px}
  .pop button{color:#fff;font-weight:600;padding:8px;border-radius:4px}

  .date-cell{height:36px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:500;font-size:13px;position:relative}
  .date-cell input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  .date-cell.overdue{color:#B7233C;font-weight:700}
  .date-cell.today{color:#B26A00;font-weight:700}
  .date-cell.soon{color:#2A63B5}
  .date-cell.done{color:var(--ink-2)}
  .days{font-weight:700;font-size:13px}
  .days.none{color:var(--ink-2);font-weight:500}
  .del{color:var(--ink-2);font-size:14px;opacity:0;width:100%;height:36px}
  .row:hover .del{opacity:1}
  .del:hover{color:var(--s-detenido)}

  .add-row td{padding:0}
  .add-row input{width:100%;height:36px;border:none;background:transparent;padding:0 14px;outline:none;color:var(--ink);font-size:13.5px}
  .add-row input::placeholder{color:var(--ink-2)}
  .add-row input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--brand)}

  .g-sum{display:flex;justify-content:flex-end;padding:6px 8px 0}
  .sum-bar{display:flex;width:24%;min-width:150px;height:22px;border-radius:4px;overflow:hidden}
  .sum-bar span{height:100%;transition:width .2s}

  /* Bitácora (Status del Gantt) */
  .logbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:#F3F4F8;border:1px solid var(--line);white-space:nowrap;max-width:100%}
  .logbtn.has{color:var(--brand);background:#EEF0FF;border-color:transparent}
  .logbtn:hover{filter:brightness(.96)}
  .desc-box{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);width:420px;max-width:95vw}
  .desc-box h4{margin:0 0 8px;font-size:14px}
  .desc-box .log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .desc-box .entry{display:flex;gap:8px;align-items:flex-start;background:var(--hover);border-radius:8px;padding:7px 9px;font-size:13px}
  .desc-box .entry time{font-size:11.5px;font-weight:700;color:var(--brand);white-space:nowrap;padding-top:1px}
  .desc-box .entry p{margin:0;flex:1;white-space:pre-wrap}
  .desc-box .entry button{color:#fff;font-size:11px;font-weight:700;background:#E2445C;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;flex-shrink:0;opacity:.9;padding:0}
  .desc-box .entry button:hover{opacity:1;background:#B7233C;transform:scale(1.1)}
  .desc-box .empty{color:var(--ink-2);font-size:12.5px;padding:6px 2px}
  .desc-box textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
  .desc-box .r{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
  .client-tag{font-size:12px;color:var(--ink-2)}
  /* Progreso de etapas */
  .prog{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#F3F4F8;color:var(--ink-2);font-weight:600;font-size:12px;white-space:nowrap;border:1px solid var(--line)}
  .prog.act{background:#EEF0FF;color:#3F3FCF;border-color:transparent}
  .prog.ok{background:#E6F7F0;color:#0E7A52;border-color:transparent}
  .prog .bar{display:inline-flex;gap:2px}
  .prog .bar i{width:12px;height:6px;border-radius:3px;background:#D9DBFF;display:block}
  .prog .bar i.done{background:#6161FF} .prog .bar i.skip{background:#C4C4C4} .prog.ok .bar i{background:#00C875}
  .steps{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:300px;overflow:auto}
  .st{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--hover);border-left:3px solid #C4C4C4}
  .st.done{border-left-color:#00C875} .st.cur{border-left-color:#FDAB3D;background:#FFF7EA} .st.skip{opacity:.6}
  .st .n{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink-2);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
  .st.done .n{background:#00C875;color:#fff} .st.cur .n{background:#FDAB3D;color:#fff}
  .st .b{flex:1;min-width:0}
  .st b{font-weight:600;font-size:13px;display:block}
  .st p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;display:flex;gap:6px}
  .st p time{color:var(--brand);font-weight:700;font-size:11.5px;white-space:nowrap}
  .st p span{flex:1}
  .st p button{color:var(--ink-2);font-size:11px;opacity:.6} .st p button:hover{color:var(--s-detenido);opacity:1}
  .st .pend{font-size:12px;color:var(--ink-2);font-style:italic}
  .desc-box select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px;background:#fff}
  /* Fotos */
  .photo-box{width:460px}
  .photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .photo-grid figure{margin:0;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--hover)}
  .photo-grid img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .photo-grid figure button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;line-height:22px;text-align:center}
  .photo-grid figure button:hover{background:var(--s-detenido)}
  .photo-grid figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:10.5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .photo-drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--ink-2);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
  .photo-drop:hover,.photo-drop.over{border-color:var(--brand);background:#EEF0FF;color:var(--brand)}

    <button class="swatch" data-t="uva" title="Uva" style="background:linear-gradient(135deg,#5A189A,#FF6B9D)"></button>
    <button class="swatch" data-t="noche" title="Noche" style="background:linear-gradient(135deg,#181B2C,#8B85FF)"></button>
  </div>
</aside>

<main>
  <div class="sticky-top">
  <div class="top">
    <h1>Panel de Operaciones<small id="today"></small></h1>
    <div class="actions">
      <button class="bell-btn" id="btnBell" title="Alertas"><span>🔔</span><span class="bell-badge" id="bellBadge" hidden>0</span></button>
      <button class="btn" id="btnBriefing">⚡ Resumen</button>
      <button class="btn" id="btnExport">⬇ Excel</button><button class="btn" id="btnExportPPT">⬇ PowerPoint</button>
      <button class="btn primary" id="btnNew">+ Nueva demanda</button>
    </div>
  </div>
  <section class="panel" id="formPanel" hidden>
    <h2 id="formTitle">Nueva demanda</h2>
    <div class="fgrid">
      <label class="half" data-tip="¿Qué pide? Describe la solicitud">Demanda <input id="fTitle" placeholder="Ej: No hay shampoo en el vestuario de caballeros piso 14"></label>
      <label class="third" data-tip="¿Quién pide? Nombre del asociado">Cliente <input id="fClient" list="dlClient" placeholder="Ej: Daria Lacman"></label>
      <label class="third" data-tip="¿Quién ejecuta? Persona a cargo">Responsable <input id="fPerson" list="dlPerson" placeholder="Nombre"></label>
      <label class="third" data-tip="¿Cuándo lo pidió el cliente?">Día solicitud cliente <input type="date" id="fReq"></label>
      <label class="third" data-tip="¿Cuándo se empezó a trabajar?">Día de inicio <input type="date" id="fStart"></label>
      <label class="third" data-tip="¿Cuándo termina o debe terminar?">Día de finalización <input type="date" id="fDate"></label>
      <label class="third">Etapa <select id="fStatus"></select></label>
      <label class="third">Prioridad <select id="fPrio"></select></label>
      <label class="third">Área <select id="fArea"></select></label>
      <label class="third">Grupo <select id="fGroup"></select></label>
      <label class="third" data-tip="¿De qué departamento es quien pide?">Departamento <input id="fDept" list="dlDept" placeholder="Ej: HR, IT, Marketing"></label>
      <label class="full" data-tip="¿Qué se ha hecho? Queda registrado con fecha en la bitácora">Primer avance / status <select id="fStep" style="margin-bottom:6px"></select><textarea id="fDesc" placeholder="Ej: Asociado notifica que no hay shampoo en el box 2. Se da aviso a maestranza…"></textarea></label>
    </div>
    <div class="form-actions">
      <button class="btn" id="btnCancel">Cancelar</button>
      <button class="btn primary" id="btnSave">Guardar demanda</button>
    </div>
  </section>
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <input id="search" placeholder="Buscar demanda, cliente, avance…">
    <select id="filtClient"><option value="">Cliente</option></select>
    <select id="filtPerson"><option value="">Responsable</option></select>
    <select id="filtDept"><option value="">Departamento</option></select>
    <select id="filtStatus"><option value="">Etapa</option></select>
    <button id="btnClear" hidden>✕ Limpiar filtros</button>
    <label class="toggle"><input type="checkbox" id="showDone"> Mostrar finalizadas</label>
    <span class="spacer"></span>
    <button class="chip open" data-f="open"><span class="cic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg></span><span class="ct"><b>0</b><small>Abiertas</small></span></button>
    <button class="chip overdue" data-f="overdue"><span class="cic"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><span class="ct"><b>0</b><small>Vencidas</small></span></button>
    <button class="chip today" data-f="today"><span class="cic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6M12 2v3"/></svg></span><span class="ct"><b>0</b><small>Vencen hoy</small></span></button>
    <button class="chip soon" data-f="soon"><span class="cic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 15h3"/></svg></span><span class="ct"><b>0</b><small>Próximos 3 días</small></span></button>
    <button class="chip closed" data-f="done"><span class="cic"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><span class="ct"><b>0</b><small>Finalizadas</small></span></button>
  </div>
  </div>

  <div id="groups"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY='tablero-monday-v1';
  /* Etapa (columna "Etapa" del Gantt) */
  const STATUS={plan:{l:'Plan',c:'var(--s-nuevo)'},ejecucion:{l:'En ejecución',c:'var(--s-trabajando)'},detenido:{l:'Detenido',c:'var(--s-detenido)'},finalizado:{l:'Finalizado',c:'var(--s-listo)'}};
  const SICON={plan:'○',ejecucion:'◔',detenido:'!',finalizado:'✓'};
  const OLD_STATUS={nuevo:'plan',trabajando:'ejecucion',revision:'ejecucion',listo:'finalizado',detenido:'detenido'};
  const DONE='finalizado';
  /* Etapas del avance (columna Status) */
  const STEPS=[{k:'notif',l:'Notificación del cliente'},{k:'coord',l:'Coordinación para ejecución'},{k:'compra',l:'Compra o adquisición',opt:true},{k:'ejec',l:'Ejecución'},{k:'final',l:'Notificación final'}];
  const stepIdx=k=>STEPS.findIndex(s=>s.k===k);
  const stepLabel=k=>{const s=STEPS.find(x=>x.k===k); return s?s.l:'Nota';};
  function stepState(t){
    const done=new Set((t.log||[]).map(e=>e.step).filter(Boolean));
    const last=Math.max(-1,...[...done].map(stepIdx));
    const st=STEPS.map((s,i)=>done.has(s.k)?'done':(s.opt&&i<last?'skip':(i===last+1?'cur':'')));
    const n=STEPS.filter((s,i)=>st[i]==='done'||st[i]==='skip').length;
    return {st,n,last,complete:done.has('final')};
  }
  const PRIO={critica:{l:'Crítica',c:'var(--p-critica)'},alta:{l:'Alta',c:'var(--p-alta)'},media:{l:'Media',c:'var(--p-media)'},baja:{l:'Baja',c:'var(--p-baja)'}};
  const GCOLORS=['var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)','var(--g6)'];
  const $=id=>document.getElementById(id);
  let data={groups:[]}; let filter=''; const DKEY=KEY+'-showdone'; let showDone=false; try{ showDone=localStorage.getItem(DKEY)==='1'; }catch(e){}
  const recent=new Set(); /* demandas recién finalizadas en esta sesión: se siguen mostrando aunque estén ocultas las finalizadas */
  const AKEY=KEY+'-area'; let area='todas'; try{ area=localStorage.getItem(AKEY)||'todas'; }catch(e){}
  const areaById=id=>AREAS.find(a=>a.id===id);
  const DEF_GROUPS=['Esta semana','Próximas','Realizadas'];
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const todayISO=()=>new Date().toISOString().slice(0,10);

  /* Migración de tareas del tablero anterior al modelo de demandas */
  function migrateTask(t){
    let ch=false;
    if(OLD_STATUS[t.status]&&OLD_STATUS[t.status]!==t.status){ t.status=OLD_STATUS[t.status]; ch=true; }
    if(!STATUS[t.status]){ t.status='plan'; ch=true; }
    if(!PRIO[t.prio]){ t.prio='media'; ch=true; }
    if(t.client===undefined){ t.client=''; ch=true; }
    if(t.reqDate===undefined){ t.reqDate=t.createdAt?new Date(t.createdAt).toISOString().slice(0,10):''; ch=true; }
    if(t.startDate===undefined){ t.startDate=t.status!=='plan'?t.reqDate:''; ch=true; }
    if(!Array.isArray(t.log)){ t.log=[]; ch=true; }
    if(!Array.isArray(t.photos)){ t.photos=[]; ch=true; }
    if(t.desc){ t.log.unshift({d:t.reqDate||todayISO(),text:t.desc}); t.desc=''; ch=true; }
    if(t.time!==undefined){ delete t.time; ch=true; }
    return ch;
  }
  function ensureAreas(){
    let changed=false;
    data.groups.forEach(g=>{ if(!g.area||!areaById(g.area)){ g.area=AREAS[2].id; changed=true; } g.tasks.forEach(t=>{ if(migrateTask(t)) changed=true; }); });
    /* Une grupos duplicados (misma área y mismo nombre) que hayan quedado de versiones anteriores */
    const seen={}; const keep=[];
    data.groups.forEach(g=>{ const k=g.area+'|'+g.name.trim().toLowerCase(); if(seen[k]){ seen[k].tasks.push(...g.tasks); changed=true; } else { seen[k]=g; keep.push(g); } });
    if(keep.length!==data.groups.length) data.groups=keep;
    AREAS.forEach((a,ai)=>{ if(!data.groups.some(g=>g.area===a.id)){ DEF_GROUPS.forEach((n,i)=>data.groups.push({id:uid(),name:n,color:GCOLORS[(ai+i)%GCOLORS.length],collapsed:false,area:a.id,tasks:[]})); changed=true; } });
    return changed;
  }
  function setArea(id){ area=id; try{ localStorage.setItem(AKEY,id); }catch(e){} render(); }
  function defaultData(){ return {groups:[]}; }

  // Temas
  const TKEY=KEY+'-tema';
  function applyTheme(t,persist){
    document.documentElement.dataset.theme=t;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.t===t));
    if(persist){ try{ localStorage.setItem(TKEY,t); }catch(e){} }
  }
  document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{applyTheme(s.dataset.t,true);toast('Tema '+s.title);}));

  // ---------- Firebase ----------
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage();
  const docRef=db.collection('tableros').doc(TABLERO_ID);
  let unsub=null, saveTimer=null, pendingRemote=null, migrated=false;
  function setSync(cls,txt){ const e=$('sync'); e.className='sync '+cls; e.querySelector('span').textContent=txt; }

  async function doLogin(){
    $('loginErr').textContent='';
    const email=$('lEmail').value.trim(), pass=$('lPass').value;
    if(!email||!pass){ $('loginErr').textContent='Escribe tu correo y contraseña.'; return; }
    try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword(email,pass); }
    catch(e){
      const m={'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Contraseña incorrecta.','auth/user-not-found':'Ese correo no está registrado.','auth/invalid-email':'El correo no es válido.','auth/too-many-requests':'Demasiados intentos, espera unos minutos.'};
      $('loginErr').textContent=m[e.code]||('No se pudo iniciar sesión: '+e.message);
    }
  }
  $('btnLogin').addEventListener('click',doLogin);
  $('lPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  $('btnReset').addEventListener('click',async()=>{
    const email=$('lEmail').value.trim(); if(!email){ $('loginErr').textContent='Escribe tu correo y vuelve a pulsar "Olvidé mi clave".'; return; }
    try{ await auth.sendPasswordResetEmail(email); $('loginErr').style.color='var(--s-listo)'; $('loginErr').textContent='Te enviamos un correo para cambiar la clave.'; }
    catch(e){ $('loginErr').textContent='No se pudo enviar: '+e.message; }
  });

  auth.onAuthStateChanged(user=>{
    if(unsub){unsub();unsub=null;}
    if(!user){ $('login').hidden=false; return; }
    const email=(user.email||'').toLowerCase();
    if(!USUARIOS_AUTORIZADOS.map(x=>x.toLowerCase()).includes(email)){
      $('loginErr').textContent='La cuenta '+email+' no está autorizada.'; auth.signOut(); return;
    }
    $('login').hidden=true;
    const meName=email.split('@')[0].replace(/[._-]/g,' '); const mp=persona(meName)||PERSONAS.find(p=>norm(meName).includes(norm(p.name.split(' ')[0])));
    $('me').innerHTML=`${avatarHtml(mp?mp.name:meName,'lg')}<span>${esc(mp?mp.name:email)}</span><button id="btnOut">salir</button>`;
    $('btnOut').addEventListener('click',()=>auth.signOut());
    unsub=docRef.onSnapshot(snap=>{
      if(snap.exists&&snap.data().json){ const remote=JSON.parse(snap.data().json);
        if(!$('formPanel').hidden||document.activeElement.isContentEditable||pop){ pendingRemote=remote; setSync('ok','Cambios nuevos al cerrar el panel'); return; }
        data=remote; if(ensureAreas()&&!migrated){ migrated=true; save(); } }
      else { data=defaultData(); ensureAreas(); save(); }
      setSync('ok',snap.metadata.hasPendingWrites?'Guardando…':'Sincronizado');
      render();
    },err=>{ setSync('err','Sin permiso o sin conexión'); console.error(err); });
  });
  function applyPending(){ if(pendingRemote){ data=pendingRemote; pendingRemote=null; ensureAreas(); render(); } }

  async function load(){ let theme='clasico'; try{ theme=localStorage.getItem(TKEY)||'clasico'; }catch(e){} applyTheme(theme,false); }
  async function save(){
    setSync('saving','Guardando…');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{ await docRef.set({json:JSON.stringify(data),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:(auth.currentUser&&auth.currentUser.email)||''}); setSync('ok','Sincronizado'); }
      catch(e){ setSync('err','No se pudo guardar'); toast('No se pudo guardar: revisa las reglas de Firestore'); }
    },300);
  }

  // Fechas
  const DAY=86400000; const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
  const pd=s=>s?new Date(s+'T12:00'):null;
  function dueInfo(t){
    if(t.status===DONE) return {cls:'done',label:t.date?fmt(pd(t.date)):'Finalizada'};
    if(!t.date) return {cls:'later',label:'Sin fecha'};
    const due=pd(t.date); const now=new Date();
    const days=Math.round((sod(due)-sod(now))/DAY);
    if(days<0) return {cls:'overdue',label:days===-1?'Venció ayer':'Hace '+(-days)+' días'};
    if(days===0) return {cls:'today',label:'Hoy'};
    if(days===1) return {cls:'soon',label:'Mañana'};
    if(days<=3) return {cls:'soon',label:'En '+days+' días'};
    return {cls:'later',label:fmt(due)};
  }
  /* Duración de días: inicio (o solicitud) → finalización si está cerrada, si no → hoy */
  function durationDays(t){
    const s=t.startDate||t.reqDate; if(!s) return null;
    let e=t.status===DONE?(t.date||(t.doneAt?new Date(t.doneAt).toISOString().slice(0,10):todayISO())):todayISO();
    const n=Math.round((sod(pd(e))-sod(pd(s)))/DAY); return n<0?0:n;
  }
  const fmt=d=>d.toLocaleDateString('es-CL',{day:'numeric',month:'short'});
  const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const norm=x=>(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  function persona(name){ const n=norm(name); if(!n) return null; return PERSONAS.find(p=>[p.name,...(p.aliases||[])].some(nm=>{const pn=norm(nm); return n===pn||n.startsWith(pn.split(' ')[0])||pn.startsWith(n.split(' ')[0]);}))||null; }
  function avatarHtml(name,cls){
    if(!name) return '';
    const p=persona(name); const ini=initials(name);
    const color=p?p.color:'';
    const img=p&&p.photo?`<img src="${esc(p.photo)}" alt="" onerror="this.remove()">`:'';
    return `<span class="avatar ${cls||''}" style="${color?'--pc:'+color:''}" title="${esc(name)}">${ini}${img}</span>`;
  }
  const allTasks=()=>data.groups.flatMap(g=>g.tasks);
  const lastLog=t=>(t.log&&t.log.length)?t.log[t.log.length-1]:null;
  const logText=t=>(t.log||[]).map(e=>stepLabel(e.step)+' '+e.text).join(' ');

  // Render
  function render(){
    $('today').textContent=new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const c={overdue:0,today:0,soon:0,open:0,done:0};
    allTasks().filter(t=>area==='todas'||(data.groups.find(g=>g.tasks.includes(t))||{}).area===area).forEach(t=>{const i=dueInfo(t); if(c[i.cls]!==undefined)c[i.cls]++; if(t.status===DONE) c.done++; else c.open++;});
    document.querySelectorAll('.chip').forEach(ch=>{ch.querySelector('b').textContent=c[ch.dataset.f]; ch.classList.toggle('on',filter===ch.dataset.f); ch.classList.toggle('has',c[ch.dataset.f]>0);});
    const so=$('sideOverdue').querySelector('.badge'); so.textContent=c.overdue; so.classList.toggle('zero',!c.overdue);
    const st=$('sideToday').querySelector('.badge'); st.textContent=c.today; st.classList.toggle('zero',!c.today);
    updateBell();
    refreshFilters();
    const FIDS=['search','filtClient','filtPerson','filtDept','filtStatus'];
    FIDS.forEach(id=>$(id).classList.toggle('active',!!$(id).value));
    $('btnClear').hidden=!( FIDS.some(id=>$(id).value)||filter );

    const q=$('search').value.trim().toLowerCase(), fc=$('filtClient').value, fp=$('filtPerson').value, fd=$('filtDept').value, fs=$('filtStatus').value;
    $('showDone').checked=showDone;
    const matchF=t=>{ if(filter==='done') return t.status===DONE; if(t.status===DONE&&!showDone&&!fs&&!recent.has(t.id)) return false; if(!filter) return true; if(filter==='open') return t.status!==DONE; return dueInfo(t).cls===filter; };
    const tabs=$('tabs'); const pend=a=>data.groups.filter(g=>g.area===a.id).flatMap(g=>g.tasks).filter(t=>t.status!==DONE).length;
    tabs.innerHTML=`<button class="tab ${area==='todas'?'on':''}" data-a="todas"><i></i>Todas <span class="n">${allTasks().filter(t=>t.status!==DONE).length}</span></button>`+
      AREAS.map(a=>`<button class="tab ${area===a.id?'on':''}" data-a="${a.id}" style="--ac:${a.color}">${avatarHtml(a.owner)}${esc(a.name)} <small>${esc(a.owner)}</small><span class="n">${pend(a)}</span></button>`).join('');
    tabs.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setArea(b.dataset.a)));
    $('sideAreas').innerHTML=AREAS.map(a=>`<div class="item ${area===a.id?'active':''}" data-a="${a.id}"><span style="display:flex;align-items:center;gap:6px">${avatarHtml(a.owner)}${esc(a.name)}</span><span class="badge soft">${pend(a)}</span></div>`).join('');
    $('sideAreas').querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>setArea(b.dataset.a)));

    const wrap=$('groups'); wrap.innerHTML='';
    const renderGroup=(g,virtual)=>{
      const el=document.createElement('section'); el.className='group'+((virtual?collapsedAll.has(g.name):g.collapsed)?' collapsed':''); el.style.setProperty('--gc',g.color); el.style.color=g.color;
      let tasks=g.tasks.filter(t=>(!q||(t.title+' '+t.client+' '+t.person+' '+t.dept+' '+logText(t)).toLowerCase().includes(q))&&(!fc||t.client===fc)&&(!fp||t.person===fp)&&(!fd||t.dept===fd)&&(!fs||t.status===fs)&&matchF(t));
      el.innerHTML=`<div class="g-head"><button class="caret">▼</button><span class="name" ${virtual?'':'contenteditable="true"'} spellcheck="false">${esc(g.name)}</span><span class="count">${tasks.length} demanda${tasks.length===1?'':'s'}</span>${virtual?'':'<button class="gmenu" title="Eliminar grupo">✕</button>'}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="col-name" data-tip="¿Qué pide? Describe la solicitud del cliente">Demanda</th><th class="col-client" data-tip="¿Quién pide? Nombre del asociado que hace la solicitud">Cliente</th><th class="col-person" data-tip="¿Quién ejecuta? Persona a cargo de resolverla">Responsable</th><th class="col-status" data-tip="¿En qué va? Plan → En ejecución → Finalizado (o Detenido)">Etapa</th><th class="col-prio" data-tip="¿Qué tan urgente? Crítica, alta, media o baja">Prioridad</th><th class="col-date" data-tip="¿Cuándo lo pidió? Día en que el cliente hizo la solicitud">Solicitud</th><th class="col-date" data-tip="¿Cuándo se empezó? Se completa solo al pasar a En ejecución">Inicio</th><th class="col-date" data-tip="¿Cuándo termina? Fecha límite o de cierre; se colorea si vence">Finalización</th><th class="col-days" data-tip="¿Cuánto llevó? Se calcula solo: inicio → hoy o → finalización">Días</th><th class="col-dept" data-tip="¿De qué departamento es quien pide? Área del cliente (HR, IT, Marketing…)">Depto.</th><th class="col-log" data-tip="¿En qué paso va? Notificación → Coordinación → Compra → Ejecución → Notificación final">Status</th><th class="col-photo" data-tip="Fotos del trabajo: antes, durante y después">Fotos</th><th class="col-x"></th></tr></thead><tbody></tbody></table></div>
      <div class="g-sum"><div class="sum-bar"></div></div>`;
      const hiddenDone=(!showDone&&filter!=='done'&&!fs)?g.tasks.filter(t=>t.status===DONE).length:0;
      if(hiddenDone){ el.querySelector('.count').textContent=tasks.length+' demanda'+(tasks.length===1?'':'s')+' · '+hiddenDone+' finalizada'+(hiddenDone===1?'':'s')+' oculta'+(hiddenDone===1?'':'s'); }
      const tb=el.querySelector('tbody');
      tasks.forEach(t=>tb.appendChild(rowEl(t,virtual?ownerGroup(t):g,virtual)));
      const add=document.createElement('tr'); add.className='add-row'; add.innerHTML=`<td colspan="13"><input placeholder="${virtual?'+ Agregar demanda (elige el área en el panel)':'+ Agregar demanda'}"></td>`;
      add.querySelector('input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.value.trim()){ if(virtual){ openForm(null,null); $('fTitle').value=e.target.value.trim(); const opt=[...$('fGroup').options].find(o=>o.textContent.toLowerCase()===g.name.toLowerCase()); if(opt) $('fGroup').value=opt.value; } else addTask(g,e.target.value.trim()); } });
      tb.appendChild(add);
      if(hiddenDone){ const hr=document.createElement('tr'); hr.className='add-row'; hr.innerHTML=`<td colspan="13"><button class="showdone-link">✓ ${hiddenDone} finalizada${hiddenDone===1?'':'s'} oculta${hiddenDone===1?'':'s'} · mostrar</button></td>`; hr.querySelector('button').addEventListener('click',()=>{ showDone=true; $('showDone').checked=true; try{ localStorage.setItem(DKEY,'1'); }catch(x){} render(); }); tb.insertBefore(hr,add); }
      const bar=el.querySelector('.sum-bar'); const n=g.tasks.length||1;

      const stepsHtml=STEPS.map((s,i)=>{

      p.querySelectorAll('.st p button').forEach(b=>b.addEventListener('click',()=>{ if(confirm('¿Borrar este avance?')){ t.log.splice(+b.dataset.j,1); save(); draw(); render(); } }));

  const fmtISO=s=>s?pd(s).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit'}):'';
  /* Fotos: se comprimen en el navegador (máx 1400px, JPEG) y se suben a Firebase Storage */
  function compressImage(file){
    return new Promise((res,rej)=>{
      const img=new Image(); const url=URL.createObjectURL(file);
      img.onload=()=>{ URL.revokeObjectURL(url); const MAX=1400; let w=img.width,h=img.height; const r=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('No se pudo procesar la imagen')),'image/jpeg',0.82); };
      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Archivo no válido')); };
      img.src=url;
    });
  }
  async function uploadPhotos(t,files,onProgress){
    const list=[...files].filter(f=>f.type.startsWith('image/'));
    for(let i=0;i<list.length;i++){
      onProgress&&onProgress(i+1,list.length);
      const blob=await compressImage(list[i]);
      const path='demandas/'+t.id+'/'+uid()+'.jpg';
      const ref=storage.ref(path);
      await ref.put(blob,{contentType:'image/jpeg'});
      const url=await ref.getDownloadURL();
      t.photos.push({url,path,name:list[i].name,d:todayISO(),by:(auth.currentUser&&auth.currentUser.email)||''});
    }
  }

      p.innerHTML=`<h4>Fotos · ${esc(t.title)}</h4>
        <div class="photo-grid">${grid}</div>${grid?'':'<div class="empty">Sin fotos todavía.</div>'}
        <label class="photo-drop"><input type="file" accept="image/*" multiple>📷 Toca para elegir fotos o arrástralas aquí<div class="prog"></div></label>
        <div class="r"><button class="btn" data-a="c">Cerrar</button></div>`;
      p.querySelector('[data-a=c]').addEventListener('click',closePop);
      p.querySelectorAll('.photo-grid img').forEach(im=>im.addEventListener('click',()=>lightbox(im.src)));
      p.querySelectorAll('.photo-grid button').forEach(b=>b.addEventListener('click',async()=>{ const ph=t.photos[+b.dataset.i]; if(!confirm('¿Borrar esta foto?')) return; try{ if(ph.path) await storage.ref(ph.path).delete(); }catch(e){} t.photos.splice(+b.dataset.i,1); save(); draw(); render(); }));
      const drop=p.querySelector('.photo-drop'), inp=drop.querySelector('input'), prog=drop.querySelector('.prog');
      const handle=async files=>{ if(!files||!files.length) return; try{ await uploadPhotos(t,files,(i,n)=>prog.textContent='Subiendo '+i+' de '+n+'…'); save(); draw(); render(); toast('Fotos guardadas'); } catch(e){ console.error(e); prog.textContent=''; toast('No se pudo subir: '+(e.code==='storage/unauthorized'?'revisa las reglas de Storage':e.message)); } };
      inp.addEventListener('change',()=>handle(inp.files));
      drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
      drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
      drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');handle(e.dataTransfer.files);});

  function lightbox(src){ const l=document.createElement('div'); l.className='lightbox'; l.innerHTML=`<img src="${esc(src)}" alt="">`; l.addEventListener('click',()=>l.remove()); document.body.appendChild(l); }
  function place(p,anchor){

  function updateBell(){

  function buildXLSX(){
    const COLS=['Área','Cliente','Demanda','Etapa','Responsable','Día solicitud','Día inicio','Día finalización','Días','Prioridad','Depto.','Último avance','Fotos'];
    const EC={plan:'FFC4C4C4',ejecucion:'FFFDAB3D',detenido:'FFE2445C',finalizado:'FF00C875'};
    const PC={critica:'FF333333',alta:'FF401694',media:'FF5559DF',baja:'FF579BFC'};
    const rows=[];
    data.groups.forEach(g=>{
      g.tasks.forEach(t=>{
        const dd=durationDays(t); const ll=lastLog(t);
        const lastTxt=ll?(fmtISO(ll.d)+' ['+stepLabel(ll.step)+'] '+ll.text):'';
        const np=(t.photos||[]).length;
        rows.push({area:(areaById(g.area)||{}).name||'',client:t.client||'',title:t.title,status:t.status,statusL:STATUS[t.status].l,person:t.person||'',reqDate:t.reqDate||'',startDate:t.startDate||'',date:t.date||'',days:dd===null?'':dd,prio:t.prio,prioL:PRIO[t.prio].l,dept:t.dept||'',lastTxt,np,photo0:(t.photos&&t.photos[0])?t.photos[0].url:''});
      });
    });
    const wb=XLSX.utils.book_new();
    const wsData=[COLS];
    rows.forEach(r=>wsData.push([r.area,r.client,r.title,r.statusL,r.person,r.reqDate,r.startDate,r.date,r.days,r.prioL,r.dept,r.lastTxt,r.np?'📷 Ver fotos':'']));
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols']=[{wch:14},{wch:18},{wch:36},{wch:14},{wch:18},{wch:12},{wch:12},{wch:12},{wch:6},{wch:10},{wch:14},{wch:52},{wch:12}];
    ws['!freeze']={xSplit:0,ySplit:1};
    // Estilo encabezado
    const hs={font:{bold:true,color:{rgb:'FFFFFFFF'},sz:11},fill:{fgColor:{rgb:'FF323338'}},alignment:{horizontal:'center'},border:{bottom:{style:'medium',color:{rgb:'FF6161FF'}}}};
    for(let c=0;c<COLS.length;c++){const a=XLSX.utils.encode_cell({r:0,c});if(ws[a])ws[a].s=hs;}
    // Estilos filas
    rows.forEach((r,ri)=>{
      const even=ri%2===0;
      const base=even?'FFFFFFFF':'FFF7F8FB';
      for(let c=0;c<COLS.length;c++){
        const addr=XLSX.utils.encode_cell({r:ri+1,c});
        if(!ws[addr])ws[addr]={v:'',t:'s'};
        let fill=base;
        if(c===3)fill=EC[r.status]||base;
        if(c===9)fill=PC[r.prio]||base;
        const dark=c===3||c===9;
        ws[addr].s={fill:{fgColor:{rgb:fill}},alignment:{vertical:'center',wrapText:c===11},font:{sz:10,color:{rgb:dark?'FFFFFFFF':'FF323338'},bold:dark}};
      }
      // Hipervínculo foto
      if(r.np&&r.photo0){
        const addr=XLSX.utils.encode_cell({r:ri+1,c:12});
        ws[addr].l={Target:r.photo0,Tooltip:'Ver '+r.np+' foto'+(r.np===1?'':'s')};
        ws[addr].s={...ws[addr].s,font:{sz:10,color:{rgb:'FF0E7A52'},underline:true,bold:true}};
      }
    });
    XLSX.utils.book_append_sheet(wb,ws,'Demandas');
    XLSX.writeFile(wb,'Panel_Operaciones.xlsx');
    toast('Excel descargado ✓');
  }

          {text:_SN[t.status]||t.status,options:{fontSize:7.5,bold:true,color:_SL[t.status]||_C.black,align:'center'}},
          {text:t.person||'—',options:{fontSize:7.5}},{text:_fd(t.reqDate),options:{fontSize:7,align:'center'}},
          {text:_fd(t.startDate),options:{fontSize:7,align:'center'}},{text:_fd(t.date),options:{fontSize:7,align:'center'}},
          {text:dd!==null?String(dd):'—',options:{fontSize:7.5,align:'center',bold:true}},
          {text:_lg(t)||'—',options:{fontSize:6.5,wrap:true,align:'left'}}]);});
      s.addTable(_rows,{x:0.15,y:1.1,w:9.7,rowH:[_HDR_H,..._rowHs],fontSize:8,color:_C.black,align:'center',border:{type:'solid',color:_C.gray2,pt:0.5},fill:_C.white,colW:_CW,autoPage:false,valign:'middle'});}
    // Fit imagen: calcula el tamaño real que debe tener en el slide
    // manteniendo proporción original (sin zoom, sin recorte, sin pixelación)
    const _fitImg=async (b64,maxW,maxH)=>{
      // Retorna {b64, w, h} con las dimensiones reales a usar en pptx
      return new Promise((res)=>{
        const img=new Image();
        const timer=setTimeout(()=>res({b64,w:maxW,h:maxH}),5000);
        img.onload=()=>{
          clearTimeout(timer);
          // Escalar para que quepa dentro de maxW x maxH manteniendo proporción
          const scale=Math.min(maxW/img.width, maxH/img.height, 1); // nunca ampliar
          res({b64, w:img.width*scale, h:img.height*scale});
        };
        img.onerror=()=>{ clearTimeout(timer); res({b64,w:maxW,h:maxH}); };
        img.src=b64;
      });
    };
    // Cargar fotos
    const _i2b=async url=>{
      for(const src of [url,'https://corsproxy.io/?'+encodeURIComponent(url)]){
        try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),10000);
          const r=await fetch(src,{signal:ctrl.signal,mode:'cors'});if(!r.ok)continue;
          const blob=await r.blob();
          const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(blob);});
          if(b64)return b64;}catch(e){continue;}
      }return null;};
    const _pt=_allT.filter(t=>(t.photos||[]).some(p=>p.url&&p.url.startsWith('http')));
    const _pd=[];
    for(const t of _pt){
      const b64s=[];
      for(const p of (t.photos||[]).filter(p=>p.url&&p.url.startsWith('http')).slice(0,3)){
        try{const b=await _i2b(p.url);if(b)b64s.push(b);}catch(e){}
      }
      _pd.push({t,b64s});
    }
    // Slides fotos
    const _SO=['notif','coord','compra','ejec','final',''];
    const _SP={notif:{bg:'E8F4FD',fg:'1A6FAD',label:'Notif. cliente'},coord:{bg:'FEF3E2',fg:'C07800',label:'Coordinación'},compra:{bg:'F3E8FD',fg:'6B21A8',label:'Compra'},ejec:{bg:'E6F7EE',fg:'166534',label:'Ejecución'},final:{bg:'D1FAE5',fg:'065F46',label:'Notif. final'},'':{bg:'F1F5F9',fg:'475569',label:'Nota'}};
    for(const {t,b64s} of _pd){
      const s=_pres.addSlide();_logo(s);bar(s);
      s.addShape('rect',{x:4.55,y:0,w:5.6,h:5.44,fill:{color:'F7F8FB'},line:{type:'none'}});
      s.addShape('rect',{x:4.55,y:0,w:0.06,h:5.44,fill:{color:_C.teal},line:{type:'none'}});
      s.addText(t.title,{x:4.68,y:0.18,w:5.15,h:0.7,fontSize:12,bold:true,color:'1A1A1A',align:'left',valign:'middle',isTextBox:true,margin:[0,0,0,10],wrap:true});
      s.addShape('line',{x:4.68,y:0.95,w:5.0,h:0,line:{color:_C.teal,pt:1.2}});
      const n=b64s.length,PX=0.12,PW=4.3,PY=1.0,PH=4.2;
      if(n>0){
        // Calcular el ancho/alto disponible por foto
        const cols=Math.min(n,2),gap=0.1;
        const zoneRows=n>2?2:1;
        const slotW=(PW-(cols-1)*gap)/cols;
        const slotH=(PH-(zoneRows-1)*gap)/zoneRows;
        // Obtener dimensiones reales (sin ampliar, manteniendo proporción)
        const fitted=await Promise.all(b64s.map(b=>_fitImg(b,slotW,slotH)));
        fitted.forEach(({b64:b,w:fw,h:fh},i)=>{
          const col=i%cols, row=Math.floor(i/cols);
          // Centrar la foto dentro de su slot
          const slotX=PX+col*(slotW+gap);
          const slotY=PY+row*(slotH+gap);
          const ox=(slotW-fw)/2; // offset x para centrar
          const oy=(slotH-fh)/2; // offset y para centrar
          s.addImage({data:b,x:slotX+ox,y:slotY+oy,w:fw,h:fh});
        });}
      else{s.addShape('rect',{x:PX,y:PY,w:PW,h:PH,fill:{color:'F0F1F5'},line:{color:'E0E2EC',pt:1}});
        s.addText('Sin fotos',{x:PX,y:PY+PH/2-0.2,w:PW,h:0.4,fontSize:10,color:'AAAAAA',align:'center',isTextBox:true,margin:0});}
      const _sL=[...(t.log||[])].sort((a,b)=>_SO.indexOf(a.step||'')-_SO.indexOf(b.step||''));
      if(_sL.length){
        const _fs=_sL.length>5?8:8.5,SX=4.68,SW=5.1,SY=1.05,SH=4.2;
        const _rH=SH/_sL.length,_pW=1.35,_pH=Math.min(_rH*0.38,0.22);
        _sL.forEach((e,idx)=>{
          const p=_SP[e.step||'']||_SP[''],ry=SY+idx*_rH;
          s.addShape('roundRect',{x:SX,y:ry+0.04,w:_pW,h:_pH,rectRadius:0.08,fill:{color:p.bg},line:{type:'none'}});
          s.addText(p.label,{x:SX,y:ry+0.04,w:_pW,h:_pH,fontSize:6.5,bold:true,color:p.fg,align:'center',valign:'middle',isTextBox:true,margin:0});
          s.addText(_fd(e.d),{x:SX+_pW+0.08,y:ry+0.04,w:0.7,h:_pH,fontSize:6.5,color:'888888',align:'left',valign:'middle',isTextBox:true,margin:0});
          s.addText(e.text,{x:SX,y:ry+_pH+0.1,w:SW,h:_rH-_pH-0.14,fontSize:_fs,color:'1A1A1A',align:'left',valign:'top',isTextBox:true,margin:[0,0,0,2],wrap:true});
          if(idx<_sL.length-1)s.addShape('line',{x:SX,y:ry+_rH-0.04,w:SW,h:0,line:{color:'E2E8F0',pt:0.5}});});
      }
    }
    await _pres.writeFile({fileName:'Panel_Operaciones_'+todayISO()+'.pptx'});
    toast('PowerPoint descargado ✓');$('btnExportPPT').textContent='⬇ PowerPoint';$('btnExportPPT').disabled=false;
    }catch(e){console.error('PPT error:',e);toast('Error: '+e.message);$('btnExportPPT').textContent='⬇ PowerPoint';$('btnExportPPT').disabled=false;}
  }
  function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000);}

  load(); setInterval(()=>{ if(!$('login').hidden) return; if(pop||!$('formPanel').hidden) return; render(); },60000);
})();
</script>
